
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>GOLIVE FC | عالم كرة القدم</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#f5f7fb;font-family:Arial,sans-serif}
header{padding:25px 18px;background:linear-gradient(130deg,#102b48,#07111f);border-bottom:1px solid #20364e}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:29px;font-weight:900;color:#35d39a}
.logo span{color:white}
button{background:#35d39a;color:#07111f;border:0;border-radius:9px;padding:10px 16px;font-weight:bold;cursor:pointer}
.hero{max-width:1100px;margin:28px auto;padding:0 16px}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{color:#aab9ca;line-height:1.7}
.tag{display:inline-block;background:#163d38;color:#6fffc3;padding:6px 10px;border-radius:20px;font-size:12px}
main{max-width:1100px;margin:25px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:17px}
.card{background:#101f30;border:1px solid #20364e;border-radius:15px;padding:19px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#35d39a}
.emoji{font-size:32px;margin-bottom:12px}
.category{font-size:12px;color:#35d39a;font-weight:bold}
.card h2{font-size:19px;line-height:1.5;margin:10px 0}
.card p{color:#b5c2d0;font-size:14px;line-height:1.8}
.card a{display:inline-block;color:#35d39a;text-decoration:none;font-weight:bold;margin-top:8px}
footer{text-align:center;color:#8193a8;padding:30px 15px;font-size:13px}
.notice{background:#182b3c;border-radius:12px;padding:14px;color:#c5d2df;font-size:13px;line-height:1.8;margin:20px 0}
[dir="ltr"] .card{text-align:left}
@media(max-width:500px){.hero h1{font-size:25px}.logo{font-size:24px}}
</style>
</head>

<header>
 <div class="top">
  <div class="logo">Goal<span>Sphere</span> ⚽</div>
  <button onclick="toggleLanguage()" id="langBtn">English</button>

let english = false;

function renderNews(){
 const container = document.getElementById("news");
 container.innerHTML = articles.map(a => `
  <article class="card">
   <div class="emoji">${a.emoji}</div>
   <div class="category">${a.category}</div>
   <h2>${english ? a.en : a.ar}</h2>
   <p>${english ? a.descEn : a.descAr}</p>
   <a href="${a.url}" target="_blank" rel="noopener">
    ${english ? "Read original source ↗" : "اقرأ المصدر الأصلي ↗"}
   </a>
  </article>
 `).join("");
}

function toggleLanguage(){
 english = !english;
 document.documentElement.lang = english ? "en" : "ar";
 document.documentElement.dir = english ? "ltr" : "rtl";
 document.getElementById("langBtn").textContent = english ? "العربية" : "English";
 document.getElementById("edition").textContent = english ? "Edition: November 18, 2026" : "نشرة 18 نوفمبر 2026";
 document.getElementById("headline").textContent = english ? "All Football News in One Place" : "كل أخبار كرة القدم في مكان واحد";
 document.getElementById("intro").textContent = english ? "Follow clubs, players and competitions from around the world with GoalSphere." : "تابع أخبار الأندية واللاعبين والبطولات العالمية من GoalSphere.";
 document.getElementById("notice").textContent = english ? "📰 This is a sample edition dated November 18, 2026. Open the original source for each story." : "📰 هذه نشرة تجريبية بتاريخ 18 نوفمبر 2026. اضغط على «اقرأ المصدر» للوصول إلى الخبر الأصلي.";
 renderNews();
}
